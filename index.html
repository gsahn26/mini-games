<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스네이크 게임</title>
<style>
  :root {
    --bg: #0f1117;
    --board-bg: #1a1d27;
    --snake: #4ade80;
    --snake-head: #22c55e;
    --food: #f87171;
    --text: #e5e7eb;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
  }
  #info {
    display: flex;
    gap: 24px;
    font-size: 16px;
  }
  #info span { color: var(--accent); font-weight: bold; }
  #board {
    background: var(--board-bg);
    border: 3px solid #2d3140;
    border-radius: 8px;
    display: block;
  }
  #message {
    min-height: 24px;
    font-size: 15px;
    color: #fbbf24;
    text-align: center;
  }
  #restart {
    padding: 8px 18px;
    font-size: 15px;
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    display: none;
  }
  #restart:hover { opacity: 0.9; }
  #hint {
    font-size: 13px;
    color: #9ca3af;
  }
</style>
</head>
<body>
  <h1>🐍 스네이크 게임</h1>
  <div id="info">
    <div>점수: <span id="score">0</span></div>
    <div>최고 점수: <span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="message"></div>
  <button id="restart">다시 시작</button>
  <div id="hint">방향키 또는 WASD로 이동 · 스페이스바로 일시정지</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restart');

const GRID = 20;
const CELLS = canvas.width / GRID;

let snake, direction, nextDirection, food, score, best, gameOver, paused, loopId;

function loadBest() {
  try {
    return parseInt(localStorage.getItem('snakeBest') || '0', 10);
  } catch (e) {
    return 0;
  }
}
function saveBest(value) {
  try {
    localStorage.setItem('snakeBest', String(value));
  } catch (e) {}
}

function randomFood() {
  while (true) {
    const pos = {
      x: Math.floor(Math.random() * CELLS),
      y: Math.floor(Math.random() * CELLS),
    };
    if (!snake.some(s => s.x === pos.x && s.y === pos.y)) return pos;
  }
}

function init() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  paused = false;
  gameOver = false;
  best = loadBest();
  food = randomFood();
  scoreEl.textContent = score;
  bestEl.textContent = best;
  messageEl.textContent = '';
  restartBtn.style.display = 'none';
  if (loopId) clearInterval(loopId);
  loopId = setInterval(tick, 110);
  draw();
}

function tick() {
  if (paused || gameOver) return;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    food = randomFood();
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(loopId);
  if (score > best) {
    best = score;
    saveBest(best);
    bestEl.textContent = best;
    messageEl.textContent = `게임 오버! 새 최고 기록: ${score}`;
  } else {
    messageEl.textContent = `게임 오버! 점수: ${score}`;
  }
  restartBtn.style.display = 'inline-block';
}

function draw() {
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg');
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0
      ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
      : getComputedStyle(document.documentElement).getPropertyValue('--snake');
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
  });

  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('일시정지', canvas.width / 2, canvas.height / 2);
  }
}

const keyMap = {
  ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
};

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    e.preventDefault();
    if (!gameOver) {
      paused = !paused;
      draw();
    }
    return;
  }
  const dir = keyMap[e.key];
  if (!dir) return;
  e.preventDefault();
  // prevent reversing directly into itself
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
});

restartBtn.addEventListener('click', init);

init();
</script>
</body>
</html>
