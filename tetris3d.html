<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D 테트리스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
 :root{
   --bg:#0b0d13;
   --panel:#161a24;
   --text:#e5e7eb;
   --accent:#60a5fa;
   --warn:#fbbf24;
 }
 *{box-sizing:border-box;}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
 #app{position:relative;width:100%;height:100%;}
 #scene-container{width:100%;height:100%;}
 #scene-container canvas{display:block;}
 #hud{
   position:absolute; top:16px; left:16px;
   background:rgba(22,26,36,0.85);
   border:1px solid #2d3140;
   border-radius:10px;
   padding:14px 18px;
   min-width:150px;
   pointer-events:none;
 }
 #hud h1{font-size:18px;margin:0 0 10px;letter-spacing:1px;}
 #hud .row{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin-bottom:4px;}
 #hud .row span.label{color:#9ca3af;}
 #hud .row span.value{color:var(--accent);font-weight:bold;}
 #next-box{
   position:absolute; top:16px; right:16px;
   background:rgba(22,26,36,0.85);
   border:1px solid #2d3140;
   border-radius:10px;
   padding:14px;
   pointer-events:none;
 }
 #next-box .title{font-size:13px;color:#9ca3af;margin-bottom:8px;text-align:center;}
 #next-grid{
   display:grid;
   grid-template-columns:repeat(4,18px);
   grid-template-rows:repeat(4,18px);
   gap:2px;
 }
 #next-grid div{
   width:18px;height:18px;border-radius:2px;background:transparent;
 }
 #hint{
   position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
   font-size:13px;color:#9ca3af; text-align:center; pointer-events:none;
   white-space:nowrap;
 }
 #overlay{
   position:absolute; inset:0;
   display:none;
   align-items:center; justify-content:center;
   flex-direction:column; gap:14px;
   background:rgba(10,12,18,0.72);
 }
 #overlay.show{display:flex;}
 #overlay h2{margin:0;font-size:30px;color:var(--warn);}
 #overlay p{margin:0;font-size:16px;color:var(--text);}
 #restart{
   padding:10px 22px;font-size:15px;background:var(--accent);color:#0f1117;
   border:none;border-radius:6px;cursor:pointer;font-weight:bold;
 }
 #restart:hover{opacity:0.9;}
 #pause-badge{
   position:absolute; top:16px; left:50%; transform:translateX(-50%);
   background:rgba(96,165,250,0.15); border:1px solid var(--accent);
   color:var(--accent); padding:6px 14px; border-radius:20px; font-size:13px;
   display:none;
 }
 #pause-badge.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="scene-container"></div>
  <div id="hud">
    <h1>🧊 3D 테트리스</h1>
    <div class="row"><span class="label">점수</span><span class="value" id="score">0</span></div>
    <div class="row"><span class="label">레벨</span><span class="value" id="level">1</span></div>
    <div class="row"><span class="label">줄</span><span class="value" id="lines">0</span></div>
    <div class="row"><span class="label">최고점수</span><span class="value" id="best">0</span></div>
  </div>
  <div id="next-box">
    <div class="title">다음 블록</div>
    <div id="next-grid"></div>
  </div>
  <div id="pause-badge">일시정지 (P)</div>
  <div id="hint">←→: 이동 · ↓: 소프트 드롭 · ↑: 회전 · 스페이스: 하드 드롭 · P: 일시정지 · 드래그: 시점 회전</div>
  <div id="overlay">
    <h2 id="overlay-title">게임 오버</h2>
    <p id="overlay-text"></p>
    <button id="restart">다시 시작</button>
  </div>
</div>

<script>
(function(){
  const COLS = 10, ROWS = 20;

  const COLORS = {
    I: 0x22d3ee,
    O: 0xfacc15,
    T: 0xa855f7,
    S: 0x4ade80,
    Z: 0xf87171,
    J: 0x60a5fa,
    L: 0xfb923c,
  };

  const SHAPES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]],
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]],
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]],
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]],
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]],
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]],
    ],
  };
  const TYPES = Object.keys(SHAPES);

  // ---------- Three.js setup ----------
  const container = document.getElementById('scene-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(6, 10, 8);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.25);
  fillLight.position.set(-6, -4, -6);
  scene.add(fillLight);

  // well frame
  const frameGeo = new THREE.BoxGeometry(COLS, ROWS, 1);
  const frameEdges = new THREE.EdgesGeometry(frameGeo);
  const frameMat = new THREE.LineBasicMaterial({ color: 0x3b4255 });
  const frameLines = new THREE.LineSegments(frameEdges, frameMat);
  scene.add(frameLines);

  const backPanelGeo = new THREE.PlaneGeometry(COLS, ROWS);
  const backPanelMat = new THREE.MeshStandardMaterial({ color:0x12151e, side:THREE.DoubleSide });
  const backPanel = new THREE.Mesh(backPanelGeo, backPanelMat);
  backPanel.position.z = -0.5;
  scene.add(backPanel);

  const boardGroup = new THREE.Group();
  scene.add(boardGroup);
  const ghostGroup = new THREE.Group();
  scene.add(ghostGroup);
  const pieceGroup = new THREE.Group();
  scene.add(pieceGroup);

  const cubeGeo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
  function makeCube(colorHex, opacity){
    const mat = new THREE.MeshStandardMaterial({
      color: colorHex, metalness:0.15, roughness:0.4,
      transparent: opacity !== undefined, opacity: opacity !== undefined ? opacity : 1,
    });
    return new THREE.Mesh(cubeGeo, mat);
  }
  function cellToPos(col, row){
    return {
      x: col - COLS/2 + 0.5,
      y: ROWS/2 - row - 0.5,
    };
  }

  // ---------- camera orbit control ----------
  let camTheta = 0.0, camPhi = 1.15, camRadius = 24;
  let dragging = false, lastX = 0, lastY = 0;
  function updateCamera(){
    const x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
    const y = camRadius * Math.cos(camPhi);
    const z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
    camera.position.set(x, y, z);
    camera.lookAt(0, 0, 0);
  }
  updateCamera();

  renderer.domElement.addEventListener('mousedown', (e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mouseup', ()=>{ dragging=false; });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    camTheta -= dx * 0.008;
    camPhi = Math.min(Math.max(camPhi - dy*0.008, 0.35), Math.PI - 0.35);
    updateCamera();
  });
  renderer.domElement.addEventListener('wheel', (e)=>{
    camRadius = Math.min(Math.max(camRadius + e.deltaY*0.02, 14), 40);
    updateCamera();
    e.preventDefault();
  }, { passive:false });

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- game state ----------
  let board, current, bag, nextType, score, level, lines, best, dropTimerId, gameOver, paused;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const bestEl = document.getElementById('best');
  const nextGrid = document.getElementById('next-grid');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const restartBtn = document.getElementById('restart');
  const pauseBadge = document.getElementById('pause-badge');

  for(let i=0;i<16;i++){ const d=document.createElement('div'); nextGrid.appendChild(d); }

  function loadBest(){ try{ return parseInt(localStorage.getItem('tetris3dBest')||'0',10); }catch(e){ return 0; } }
  function saveBest(v){ try{ localStorage.setItem('tetris3dBest', String(v)); }catch(e){} }

  function refillBag(){
    const arr = TYPES.slice();
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }
  function drawFromBag(){
    if(!bag || bag.length===0) bag = refillBag();
    return bag.pop();
  }

  function spawnPiece(){
    const type = nextType || drawFromBag();
    nextType = drawFromBag();
    renderNextPreview();
    return { type, rotation:0, x:3, y:-1 };
  }

  function renderNextPreview(){
    const cells = SHAPES[nextType][0];
    const children = nextGrid.children;
    for(let i=0;i<16;i++) children[i].style.background = 'transparent';
    cells.forEach(([cx,cy])=>{
      const idx = cy*4+cx;
      if(children[idx]) children[idx].style.background = '#'+COLORS[nextType].toString(16).padStart(6,'0');
    });
  }

  function cellsOf(piece){
    return SHAPES[piece.type][piece.rotation].map(([cx,cy])=>[piece.x+cx, piece.y+cy]);
  }

  function collides(piece){
    const cells = cellsOf(piece);
    for(const [x,y] of cells){
      if(x<0 || x>=COLS || y>=ROWS) return true;
      if(y>=0 && board[y][x]) return true;
    }
    return false;
  }

  function lockPiece(){
    const cells = cellsOf(current);
    for(const [x,y] of cells){
      if(y<0){ triggerGameOver(); return; }
      board[y][x] = COLORS[current.type];
    }
    clearLines();
    current = spawnPiece();
    if(collides(current)){ triggerGameOver(); }
    renderBoard();
  }

  function clearLines(){
    let cleared = 0;
    for(let y=ROWS-1;y>=0;y--){
      if(board[y].every(c=>c)){
        board.splice(y,1);
        board.unshift(new Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if(cleared>0){
      const points = [0,100,300,500,800][cleared] * level;
      score += points;
      lines += cleared;
      const newLevel = Math.floor(lines/10)+1;
      if(newLevel !== level){
        level = newLevel;
        resetDropTimer();
      }
      updateHud();
    }
  }

  function updateHud(){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
    bestEl.textContent = best;
  }

  function hardDrop(){
    if(gameOver||paused) return;
    let dist = 0;
    while(!collides({...current, y:current.y+1})){ current.y++; dist++; }
    score += dist*2;
    lockPiece();
    updateHud();
  }

  function dropOneStep(awardScore){
    if(gameOver||paused) return;
    if(!collides({...current, y:current.y+1})){
      current.y++;
      if(awardScore){ score += 1; updateHud(); }
      renderBoard();
    } else {
      lockPiece();
    }
  }
  function softDrop(){ dropOneStep(true); }

  function moveHorizontal(dir){
    if(gameOver||paused) return;
    const moved = {...current, x: current.x+dir};
    if(!collides(moved)){ current.x = moved.x; renderBoard(); }
  }

  function rotatePiece(){
    if(gameOver||paused) return;
    const newRotation = (current.rotation+1)%4;
    const kicks = [0,-1,1,-2,2];
    for(const k of kicks){
      const attempt = {...current, rotation:newRotation, x:current.x+k};
      if(!collides(attempt)){ current.rotation=newRotation; current.x=attempt.x; renderBoard(); return; }
    }
  }

  function ghostPosition(){
    let g = {...current};
    while(!collides({...g, y:g.y+1})) g.y++;
    return g;
  }

  function clearGroup(group){
    while(group.children.length){
      const m = group.children.pop();
      if(m.material) m.material.dispose();
      group.remove(m);
    }
  }

  function renderBoard(){
    clearGroup(boardGroup);
    clearGroup(pieceGroup);
    clearGroup(ghostGroup);

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const color = board[y][x];
        if(color){
          const cube = makeCube(color);
          const pos = cellToPos(x,y);
          cube.position.set(pos.x, pos.y, 0);
          boardGroup.add(cube);
        }
      }
    }

    if(current && !gameOver){
      const ghost = ghostPosition();
      cellsOf(ghost).forEach(([x,y])=>{
        if(y<0) return;
        const cube = makeCube(COLORS[current.type], 0.18);
        const pos = cellToPos(x,y);
        cube.position.set(pos.x,pos.y,0);
        ghostGroup.add(cube);
      });
      cellsOf(current).forEach(([x,y])=>{
        if(y<0) return;
        const cube = makeCube(COLORS[current.type]);
        const pos = cellToPos(x,y);
        cube.position.set(pos.x,pos.y,0);
        pieceGroup.add(cube);
      });
    }
  }

  function resetDropTimer(){
    if(dropTimerId) clearInterval(dropTimerId);
    const speed = Math.max(100, 800 - (level-1)*60);
    dropTimerId = setInterval(()=>{
      if(!paused && !gameOver) dropOneStep(false);
    }, speed);
  }

  function triggerGameOver(){
    gameOver = true;
    if(dropTimerId) clearInterval(dropTimerId);
    if(score > best){
      best = score; saveBest(best);
      overlayText.textContent = `새 최고 기록! 점수: ${score}`;
    } else {
      overlayText.textContent = `점수: ${score} · 줄: ${lines}`;
    }
    overlayTitle.textContent = '게임 오버';
    overlay.classList.add('show');
    updateHud();
    renderBoard();
  }

  function togglePause(){
    if(gameOver) return;
    paused = !paused;
    pauseBadge.classList.toggle('show', paused);
  }

  function initGame(){
    board = Array.from({length:ROWS},()=>new Array(COLS).fill(null));
    bag = null;
    nextType = drawFromBag();
    score = 0; level = 1; lines = 0; gameOver = false; paused = false;
    best = loadBest();
    overlay.classList.remove('show');
    pauseBadge.classList.remove('show');
    current = spawnPiece();
    updateHud();
    renderBoard();
    resetDropTimer();
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'p' || e.key === 'P'){ togglePause(); return; }
    if(gameOver || paused){
      if(e.key===' ') e.preventDefault();
      return;
    }
    switch(e.key){
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); moveHorizontal(-1); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); moveHorizontal(1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); softDrop(); break;
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); rotatePiece(); break;
      case ' ': e.preventDefault(); hardDrop(); break;
      default: return;
    }
  });

  restartBtn.addEventListener('click', initGame);

  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  initGame();
  animate();
})();
</script>
</body>
</html>
