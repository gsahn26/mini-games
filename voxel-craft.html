<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>복셀 크래프트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0b0d13;
    --accent:#facc15;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
  #app{position:relative;width:100%;height:100%;}
  #scene-container{width:100%;height:100%;cursor:crosshair;}
  #scene-container canvas{display:block;}

  #crosshair{
    position:absolute; top:50%; left:50%; width:20px; height:20px;
    transform:translate(-50%,-50%); pointer-events:none;
  }
  #crosshair::before, #crosshair::after{
    content:''; position:absolute; background:rgba(255,255,255,0.9);
  }
  #crosshair::before{ left:50%; top:1px; bottom:1px; width:2px; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:1px; right:1px; height:2px; transform:translateY(-50%); }

  #coord-panel{
    position:absolute; top:16px; left:16px;
    background:rgba(22,26,36,0.78); border:1px solid #2d3140; border-radius:10px;
    padding:10px 16px; font-size:13px; color:#cbd5e1; pointer-events:none; line-height:1.6;
  }
  #coord-panel b{ color:var(--accent); }

  #hotbar{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; pointer-events:auto;
  }
  .slot{
    width:58px; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:rgba(22,26,36,0.82); border:2px solid #2d3140; border-radius:8px;
    padding:6px 4px; cursor:pointer; user-select:none;
  }
  .slot.active{ border-color:var(--accent); box-shadow:0 0 8px rgba(250,204,21,0.5); }
  .slot .swatch{ width:28px; height:28px; border-radius:4px; border:1px solid rgba(0,0,0,0.4); }
  .slot .label{ font-size:10px; color:#cbd5e1; text-align:center; white-space:nowrap; }

  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; text-align:center;
    background:rgba(8,10,16,0.85); padding:20px;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{ margin:0; font-size:34px; }
  #overlay p{ margin:0; font-size:15px; color:#cbd5e1; max-width:520px; line-height:1.6; }
  #overlay-buttons{ display:flex; gap:10px; }
  #overlay button{
    padding:12px 26px; font-size:16px; background:var(--accent); color:#0f1117;
    border:none; border-radius:8px; cursor:pointer; font-weight:bold;
  }
  #overlay button:hover{ opacity:0.9; }
  #quit-btn{
    padding:12px 22px; font-size:15px; background:transparent; color:#cbd5e1;
    border:1px solid #3d4254; border-radius:8px; cursor:pointer; font-weight:bold;
    display:none;
  }
  #quit-btn:hover{ background:rgba(255,255,255,0.08); }
  #quit-btn.show{ display:inline-block; }
  .key{ background:#2d3140; border-radius:4px; padding:2px 8px; font-weight:bold; }
</style>
</head>
<body>
<div id="app">
  <div id="scene-container"></div>

  <div id="crosshair"></div>

  <div id="coord-panel">
    좌표 <b id="coord-xyz">0, 0, 0</b><br>
    선택한 블록 <b id="coord-block">잔디</b>
  </div>

  <div id="hotbar"></div>

  <div id="overlay">
    <h1>복셀 크래프트</h1>
    <p>
      초록빛 섬에서 자유롭게 블록을 캐고 쌓아보세요.<br><br>
      <span class="key">WASD</span> 이동 · <span class="key">Shift</span> 달리기 · <span class="key">Space</span> 점프<br>
      <span class="key">마우스</span> 시점 조작 · <span class="key">좌클릭</span> 블록 부수기(누르고 있으면 연속) · <span class="key">우클릭</span> 블록 설치(누르고 있으면 연속)<br>
      <span class="key">1~7</span> 또는 <span class="key">휠</span> 블록 선택 · <span class="key">Esc</span> 일시정지 (일시정지 화면의 나가기 버튼으로 종료)<br><br>
      클릭하면 마우스가 화면에 고정되어 조준할 수 있습니다 (Esc로 해제).
    </p>
    <div id="overlay-buttons">
      <button id="start-btn">클릭해서 시작</button>
      <button id="quit-btn">나가기</button>
    </div>
  </div>
</div>

<script>
(function(){
  const container = document.getElementById('scene-container');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const quitBtn = document.getElementById('quit-btn');
  const hotbarEl = document.getElementById('hotbar');
  const coordXyzEl = document.getElementById('coord-xyz');
  const coordBlockEl = document.getElementById('coord-block');
  const INTRO_TITLE = overlay.querySelector('h1').textContent;
  const INTRO_TEXT = overlay.querySelector('p').innerHTML;

  // ---------- constants ----------
  const WORLD_SIZE = 24;
  const HALF = WORLD_SIZE / 2;
  const BOUND = HALF + 6;
  const EYE_HEIGHT = 1.6;
  const PLAYER_HEIGHT = 1.8;
  const PLAYER_RADIUS = 0.3;
  const MOVE_SPEED = 0.09;
  const SPRINT_MULT = 1.6;
  const JUMP_V = 0.17;
  const GRAVITY = 0.012;
  const SENSITIVITY = 0.0022;
  const REACH = 7;
  const ACTION_INTERVAL = 9; // frames between repeated break/place while held
  const CAP = 9000; // max instances per block type

  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function bkey(x, y, z){ return x + ',' + y + ',' + z; }

  // ---------- audio (procedural, no external files) ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(err){ return null; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playThud(freq, dur, vol){
    const ctx = ensureAudio();
    if(!ctx) return;
    const now = ctx.currentTime;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + dur);
  }

  // ---------- three.js setup ----------
  const scene = new THREE.Scene();
  const SKY_COLOR = 0x8fcfe8;
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 55, 150);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 400);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);
  const canvas = renderer.domElement;
  canvas.addEventListener('contextmenu', (e)=> e.preventDefault());

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a3b2a, 0.9));
  const sun = new THREE.DirectionalLight(0xfff6e0, 0.85);
  sun.position.set(60, 100, 40);
  scene.add(sun);

  const floorGeo = new THREE.PlaneGeometry(400, 400);
  const floorMat = new THREE.MeshStandardMaterial({ color:0x3d5a3d, roughness:1 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.55;
  scene.add(floor);

  // ---------- block types ----------
  const BLOCK_DEFS = {
    grass:  { top:0x6abe4a, side:0x8a6b45, bottom:0x6b4a2f, label:'잔디' },
    dirt:   { color:0x8a6b45, label:'흙' },
    stone:  { color:0x8d9096, label:'돌' },
    sand:   { color:0xe3d59e, label:'모래' },
    wood:   { color:0x6b4a2f, label:'원목' },
    plank:  { color:0xb98a55, label:'판자' },
    leaves: { color:0x3f8f3f, opacity:0.92, label:'나뭇잎' },
  };
  const HOTBAR_ORDER = ['grass','dirt','stone','sand','wood','plank','leaves'];

  function hex(n){ return '#' + n.toString(16).padStart(6,'0'); }
  function buildMaterial(def){
    if(def.top !== undefined){
      const topM = new THREE.MeshStandardMaterial({ color:def.top, roughness:0.9 });
      const sideM = new THREE.MeshStandardMaterial({ color:def.side, roughness:0.9 });
      const botM = new THREE.MeshStandardMaterial({ color:def.bottom, roughness:0.9 });
      return [sideM, sideM, topM, botM, sideM, sideM];
    }
    const opts = { color:def.color, roughness:0.9 };
    if(def.opacity !== undefined){ opts.transparent = true; opts.opacity = def.opacity; }
    return new THREE.MeshStandardMaterial(opts);
  }

  const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
  const typeMeshes = {};
  const typePositions = {};
  const meshToType = new Map();
  Object.keys(BLOCK_DEFS).forEach(name=>{
    const mesh = new THREE.InstancedMesh(cubeGeo, buildMaterial(BLOCK_DEFS[name]), CAP);
    mesh.count = 0;
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(mesh);
    typeMeshes[name] = mesh;
    typePositions[name] = [];
    meshToType.set(mesh, name);
  });

  // ---------- block storage ----------
  const blocks = new Map(); // "x,y,z" -> {type, idx}
  const tmpMatrix = new THREE.Matrix4();

  function addBlock(x, y, z, type){
    const key = bkey(x,y,z);
    if(blocks.has(key)) return false;
    const mesh = typeMeshes[type];
    const idx = mesh.count;
    if(idx >= CAP) return false;
    tmpMatrix.makeTranslation(x+0.5, y+0.5, z+0.5);
    mesh.setMatrixAt(idx, tmpMatrix);
    mesh.count = idx + 1;
    mesh.instanceMatrix.needsUpdate = true;
    typePositions[type][idx] = { x, y, z };
    blocks.set(key, { type, idx });
    return true;
  }

  function removeBlock(x, y, z){
    const key = bkey(x,y,z);
    const entry = blocks.get(key);
    if(!entry) return false;
    const { type, idx } = entry;
    const mesh = typeMeshes[type];
    const positions = typePositions[type];
    const lastIdx = mesh.count - 1;
    if(idx !== lastIdx){
      mesh.getMatrixAt(lastIdx, tmpMatrix);
      mesh.setMatrixAt(idx, tmpMatrix);
      const lastPos = positions[lastIdx];
      positions[idx] = lastPos;
      blocks.set(bkey(lastPos.x, lastPos.y, lastPos.z), { type, idx });
    }
    positions.length = lastIdx;
    mesh.count = lastIdx;
    mesh.instanceMatrix.needsUpdate = true;
    blocks.delete(key);
    return true;
  }

  // ---------- world generation ----------
  function heightAt(x, z){
    const h = 5 + Math.sin(x*0.28)*1.6 + Math.cos(z*0.33)*1.6 +
              Math.sin((x+z)*0.15)*1.1 + Math.cos((x-z)*0.21)*0.8;
    return Math.max(2, Math.round(h));
  }

  function generateWorld(){
    for(let x=-HALF; x<HALF; x++){
      for(let z=-HALF; z<HALF; z++){
        const h = heightAt(x, z);
        for(let y=0; y<=h; y++){
          let type;
          if(y === h) type = 'grass';
          else if(y >= h-2) type = 'dirt';
          else type = 'stone';
          addBlock(x, y, z, type);
        }
      }
    }
    const treeCount = Math.floor((WORLD_SIZE*WORLD_SIZE) / 26);
    for(let i=0; i<treeCount; i++){
      const tx = Math.floor(rand(-HALF+2, HALF-2));
      const tz = Math.floor(rand(-HALF+2, HALF-2));
      const h = heightAt(tx, tz);
      if(h < 3) continue;
      const trunkH = 3 + Math.floor(Math.random()*2);
      for(let dy=1; dy<=trunkH; dy++) addBlock(tx, h+dy, tz, 'wood');
      const topY = h + trunkH;
      for(let dx=-2; dx<=2; dx++){
        for(let dz=-2; dz<=2; dz++){
          for(let dy=-1; dy<=1; dy++){
            if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy) > 3) continue;
            if(dx===0 && dz===0 && dy<=0) continue;
            const bx = tx+dx, by = topY+dy, bz = tz+dz;
            if(!blocks.has(bkey(bx,by,bz))) addBlock(bx, by, bz, 'leaves');
          }
        }
      }
    }
  }
  generateWorld();

  // ---------- player state ----------
  const spawnY = heightAt(0,0) + 1;
  const player = {
    x:0.5, z:0.5, y:spawnY, vy:0, onGround:false,
    yaw:0, pitch:0,
  };
  camera.position.set(player.x, player.y+EYE_HEIGHT, player.z);

  let state = 'start'; // start | playing | paused
  const keys = {};
  let breaking = false, placing = false;
  let breakCooldown = 0, placeCooldown = 0;

  // ---------- hotbar ----------
  let selectedIndex = 0;
  HOTBAR_ORDER.forEach((name, i)=>{
    const def = BLOCK_DEFS[name];
    const slot = document.createElement('div');
    slot.className = 'slot';
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = hex(def.top !== undefined ? def.top : def.color);
    slot.appendChild(swatch);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = (i+1) + ' ' + def.label;
    slot.appendChild(label);
    slot.addEventListener('click', ()=> selectSlot(i));
    hotbarEl.appendChild(slot);
  });
  function selectSlot(i){
    selectedIndex = ((i % HOTBAR_ORDER.length) + HOTBAR_ORDER.length) % HOTBAR_ORDER.length;
    [...hotbarEl.children].forEach((el, idx)=> el.classList.toggle('active', idx === selectedIndex));
    coordBlockEl.textContent = BLOCK_DEFS[HOTBAR_ORDER[selectedIndex]].label;
  }
  selectSlot(0);

  // ---------- input ----------
  window.addEventListener('keydown', (e)=>{
    keys[e.key.toLowerCase()] = true;
    if(e.key >= '1' && e.key <= '7') selectSlot(e.key.charCodeAt(0) - '1'.charCodeAt(0));
    if([' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });

  document.addEventListener('mousemove', (e)=>{
    if(document.pointerLockElement !== canvas) return;
    player.yaw -= e.movementX * SENSITIVITY;
    player.pitch -= e.movementY * SENSITIVITY;
    player.pitch = clamp(player.pitch, -Math.PI/2+0.05, Math.PI/2-0.05);
  });

  document.addEventListener('pointerlockchange', ()=>{
    if(document.pointerLockElement !== canvas && state === 'playing'){
      state = 'paused';
      breaking = false; placing = false;
      quitBtn.classList.add('show');
      showOverlay('일시정지', '클릭해서 다시 조준하세요.<br>완전히 종료하려면 아래 나가기 버튼을 누르세요.');
    }
  });

  function showOverlay(title, html){
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = title;
    overlay.querySelector('p').innerHTML = html;
  }

  function startGame(){
    state = 'playing';
    overlay.classList.add('hidden');
    quitBtn.classList.remove('show');
    ensureAudio();
    try{ canvas.requestPointerLock(); }catch(err){}
  }
  startBtn.addEventListener('click', startGame);
  quitBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    breaking = false; placing = false;
    state = 'start';
    document.exitPointerLock();
    quitBtn.classList.remove('show');
    showOverlay(INTRO_TITLE, INTRO_TEXT);
    startBtn.textContent = '클릭해서 시작';
  });

  canvas.addEventListener('mousedown', (e)=>{
    if(state === 'start' || state === 'paused'){
      if(e.button === 0) startGame();
      return;
    }
    if(state !== 'playing') return;
    if(e.button === 0){ breaking = true; breakBlock(); breakCooldown = ACTION_INTERVAL; }
    else if(e.button === 2){ placing = true; placeBlock(); placeCooldown = ACTION_INTERVAL; }
  });
  window.addEventListener('mouseup', (e)=>{
    if(e.button === 0) breaking = false;
    if(e.button === 2) placing = false;
  });
  window.addEventListener('blur', ()=>{ breaking = false; placing = false; });
  canvas.addEventListener('wheel', (e)=>{
    if(state !== 'playing') return;
    e.preventDefault();
    selectSlot(selectedIndex + (e.deltaY > 0 ? 1 : -1));
  }, { passive:false });

  // ---------- targeting ----------
  const raycaster = new THREE.Raycaster();
  const highlightGeo = new THREE.BoxGeometry(1.02, 1.02, 1.02);
  const highlightBox = new THREE.LineSegments(
    new THREE.EdgesGeometry(highlightGeo),
    new THREE.LineBasicMaterial({ color:0x111111, linewidth:2 })
  );
  highlightBox.visible = false;
  scene.add(highlightBox);
  let targetHit = null;

  function updateTargetHit(){
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    raycaster.set(camera.position, dir);
    raycaster.far = REACH;
    const meshes = Object.values(typeMeshes).filter(m => m.count > 0);
    const hits = raycaster.intersectObjects(meshes, false);
    if(hits.length === 0){ targetHit = null; highlightBox.visible = false; return; }
    const hit = hits[0];
    const type = meshToType.get(hit.object);
    const pos = typePositions[type][hit.instanceId];
    targetHit = { pos, normal: hit.face.normal.clone(), type };
    highlightBox.position.set(pos.x+0.5, pos.y+0.5, pos.z+0.5);
    highlightBox.visible = true;
  }

  function blockOverlapsPlayer(bx, by, bz){
    const r = PLAYER_RADIUS;
    return bx < player.x+r && bx+1 > player.x-r &&
           bz < player.z+r && bz+1 > player.z-r &&
           by < player.y+PLAYER_HEIGHT && by+1 > player.y;
  }

  function breakBlock(){
    if(!targetHit) return;
    removeBlock(targetHit.pos.x, targetHit.pos.y, targetHit.pos.z);
    playThud(240, 0.09, 0.55);
  }
  function placeBlock(){
    if(!targetHit) return;
    const n = targetHit.normal;
    const nx = targetHit.pos.x + Math.round(n.x);
    const ny = targetHit.pos.y + Math.round(n.y);
    const nz = targetHit.pos.z + Math.round(n.z);
    if(blockOverlapsPlayer(nx, ny, nz)) return;
    if(addBlock(nx, ny, nz, HOTBAR_ORDER[selectedIndex])) playThud(420, 0.06, 0.4);
  }

  // ---------- collision & movement ----------
  function collidesAt(px, py, pz){
    const r = PLAYER_RADIUS;
    const minX = Math.floor(px-r), maxX = Math.floor(px+r-0.001);
    const minZ = Math.floor(pz-r), maxZ = Math.floor(pz+r-0.001);
    const minY = Math.floor(py+0.001), maxY = Math.floor(py+PLAYER_HEIGHT-0.001);
    for(let bx=minX; bx<=maxX; bx++){
      for(let by=minY; by<=maxY; by++){
        for(let bz=minZ; bz<=maxZ; bz++){
          if(blocks.has(bkey(bx,by,bz))) return true;
        }
      }
    }
    return false;
  }

  function tryMove(dx, dz){
    if(dx !== 0){
      const nx = player.x + dx;
      if(!collidesAt(nx, player.y, player.z)) player.x = nx;
    }
    if(dz !== 0){
      const nz = player.z + dz;
      if(!collidesAt(player.x, player.y, nz)) player.z = nz;
    }
  }

  function updateVertical(){
    player.onGround = false;
    player.vy -= GRAVITY;
    player.vy = Math.max(player.vy, -0.6);
    const dy = player.vy;
    if(dy === 0) return;
    const steps = Math.max(1, Math.ceil(Math.abs(dy)/0.05));
    const stepDy = dy/steps;
    for(let i=0; i<steps; i++){
      const ny = player.y + stepDy;
      if(collidesAt(player.x, ny, player.z)){
        if(stepDy < 0) player.onGround = true;
        player.vy = 0;
        break;
      }
      player.y = ny;
    }
  }

  function respawn(){
    player.x = 0.5; player.z = 0.5; player.y = spawnY; player.vy = 0;
  }

  function updatePlayer(){
    if(state !== 'playing') return;

    const sprint = keys['shift'] ? SPRINT_MULT : 1;
    const speed = MOVE_SPEED * sprint;
    const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

    let mx=0, mz=0;
    if(keys['w'] || keys['arrowup']){ mx += forward.x; mz += forward.z; }
    if(keys['s'] || keys['arrowdown']){ mx -= forward.x; mz -= forward.z; }
    if(keys['d'] || keys['arrowright']){ mx += right.x; mz += right.z; }
    if(keys['a'] || keys['arrowleft']){ mx -= right.x; mz -= right.z; }
    const len = Math.hypot(mx, mz);
    if(len > 0) tryMove((mx/len)*speed, (mz/len)*speed);

    const wasOnGround = player.onGround;
    if(keys[' '] && wasOnGround){ player.vy = JUMP_V; player.onGround = false; }
    updateVertical();

    player.x = clamp(player.x, -BOUND, BOUND);
    player.z = clamp(player.z, -BOUND, BOUND);
    if(player.y < -20) respawn();

    camera.position.set(player.x, player.y+EYE_HEIGHT, player.z);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if(breaking){
      if(breakCooldown > 0) breakCooldown--;
      else { breakBlock(); breakCooldown = ACTION_INTERVAL; }
    }
    if(placing){
      if(placeCooldown > 0) placeCooldown--;
      else { placeBlock(); placeCooldown = ACTION_INTERVAL; }
    }

    coordXyzEl.textContent = Math.round(player.x) + ', ' + Math.round(player.y) + ', ' + Math.round(player.z);
  }

  function render(){
    renderer.render(scene, camera);
  }

  function loop(){
    requestAnimationFrame(loop);
    updateTargetHit();
    updatePlayer();
    render();
  }
  loop();
})();
</script>
</body>
</html>
